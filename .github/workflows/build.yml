# Builds and tests everything that needs no game data, on Linux and for Windows (issue 011), and makes the
# Windows release package (the builder: launcher, compiler, sources, tools - nothing from the game).
# The game itself is never built here: it needs code generated from the player's own disc, which must never
# reach GitHub. DW5XL_BUILD_GAME=OFF builds the runtime, the recompiler, the tools and the tests that use no
# generated code. On main, a package that passed every job replaces the files of the draft release
# "windows-test-1" (owner tests); CI never publishes a release - that is the owner's.
# Remove this file (one commit) to switch CI off again.
name: build

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PARALLEL_GS_REV: cc6184af7e0c03da603045ca371ffa5dae9b0655 # README, "pinned paraLLEl-GS"
  LLVM_MINGW: llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64
  LLVM_MINGW_SHA256: 5f9c6ed95b2d4bdb2869a488c5fd5857fbdabcf288a0aa3eb1da43f6a08d8ab4
  FFMPEG_ZIP: ffmpeg-n7.1-241205-lgpl-amd64-shared.zip
  FFMPEG_SHA256: b985887dbca8c0a9a4c47f9d2bac7ec3ab994335b1b7fe7000bdb1dcd772ac68
  # Bundled in the release package (the player's PC builds the game with these):
  LLVM_MINGW_WIN_SHA256: 317492c456aa27ee607a5919f1d2d38dcdc1112516a24d0bf4b00d078f52d17a
  CMAKE_WIN_SHA256: bace36e94b31c68ab6fa295f26dfa11219e0701cf7c94b0284a7d1cb13dac536
  NINJA_WIN_SHA256: 07fc8261b42b20e71d1720b39068c2e14ffcee6396b76fb7a795fb460b78dc65
  FFMPEG_SRC_SHA256: 40973d44970dbc83ef302b0609f2e74982be2d85916dd2ee7472d30678a7abe6 # ffmpeg-7.1.tar.xz
  # CI only ever writes this draft; releases the owner publishes (windows-test-1, ...) are never touched.
  DRAFT_TAG: windows-next

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: archlinux:latest # same clang/LLVM generation as the development machine
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git clang lld llvm cmake ninja pkgconf python ffmpeg
             libx11 libxrandr libxinerama libxcursor libxi xorgproto mesa libglvnd alsa-lib libpulse
             wayland libxkbcommon vulkan-headers
      - uses: actions/checkout@v7
      - name: No game data in the repository
        run: |
          bad=$(git ls-files | grep -iE '^(game|discs|ghidra|ghidra_iop|notes)/|/output/|^recomp/[^/]+/vu1/|vu1_lifted|\.iso$' || true)
          if [ -n "$bad" ]; then echo "game-derived or local files are tracked:"; echo "$bad"; exit 1; fi
      - name: paraLLEl-GS (pinned) with the renderer patches
        run: |
          git clone -q https://github.com/Arntzen-Software/parallel-gs.git app/deps/parallel-gs
          git -C app/deps/parallel-gs checkout -q "$PARALLEL_GS_REV"
          git -C app/deps/parallel-gs submodule update --init Granite
          git -C app/deps/parallel-gs/Granite submodule update --init third_party/volk third_party/khronos/vulkan-headers
          git -C app/deps/parallel-gs apply "$PWD"/vendor/parallel-gs-patches/*.patch
      - name: Configure
        run: >
          CC=clang CXX=clang++ cmake -S app -B app/build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_LINKER_TYPE=LLD -DDW5XL_BUILD_GAME=OFF -DDW5XL_BUILD_TESTS=ON -DPS2X_ENABLE_SCCACHE=OFF
          -DPS2X_ENABLE_AGRESSIVE_LOGS=OFF -DPS2X_ENABLE_VULKAN_GS=ON
          -DPS2X_PARALLEL_GS_SOURCE_DIR="$PWD/app/deps/parallel-gs"
      - name: Build
        run: cmake --build app/build-ci
      - name: Build the recompiler (separately, the app build turns it off)
        run: >
          CC=clang CXX=clang++ cmake -S external/PS2Recomp -B build-recomp -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_LINKER_TYPE=LLD -DPS2X_BUILD_RUNTIME=OFF -DPS2X_BUILD_ANALYZER=OFF -DPS2X_BUILD_TEST=OFF
          -DPS2X_BUILD_STUDIO=OFF -DPS2X_ENABLE_SCCACHE=OFF
          && cmake --build build-recomp --target ps2_recomp
      - name: Test (no GPU, no game data)
        run: ctest --test-dir app/build-ci --output-on-failure

  windows-build:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git cmake ninja python curl unzip xz make diffutils gcc # gcc: host compiler for FFmpeg's configure
      - uses: actions/checkout@v7
      - name: llvm-mingw (pinned, checksum)
        run: |
          curl -sSfL -o /tmp/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/$LLVM_MINGW.tar.xz"
          echo "$LLVM_MINGW_SHA256  /tmp/llvm-mingw.tar.xz" | sha256sum -c -
          tar -xf /tmp/llvm-mingw.tar.xz -C /opt
      - name: FFmpeg for Windows (pinned, checksum)
        run: |
          curl -sSfL -o "/tmp/$FFMPEG_ZIP" \
            "https://github.com/System233/ffmpeg-msvc-prebuilt/releases/download/n7.1-241205/$FFMPEG_ZIP"
          echo "$FFMPEG_SHA256  /tmp/$FFMPEG_ZIP" | sha256sum -c -
      - name: paraLLEl-GS (pinned) with the renderer patches
        run: |
          git clone -q https://github.com/Arntzen-Software/parallel-gs.git app/deps/parallel-gs
          git -C app/deps/parallel-gs checkout -q "$PARALLEL_GS_REV"
          git -C app/deps/parallel-gs submodule update --init Granite
          git -C app/deps/parallel-gs/Granite submodule update --init third_party/volk third_party/khronos/vulkan-headers
          git -C app/deps/parallel-gs apply "$PWD"/vendor/parallel-gs-patches/*.patch
      - name: Configure (cross-compile with llvm-mingw)
        run: >
          cmake -S app -B app/build-win -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$PWD/tools/windows/llvm-mingw.cmake" -DLLVM_MINGW_ROOT="/opt/$LLVM_MINGW"
          -DDW5XL_BUILD_GAME=OFF -DDW5XL_BUILD_TESTS=ON -DPS2X_ENABLE_SCCACHE=OFF
          -DPS2X_ENABLE_AGRESSIVE_LOGS=OFF -DPS2X_ENABLE_VULKAN_GS=ON
          -DPS2X_PARALLEL_GS_SOURCE_DIR="$PWD/app/deps/parallel-gs"
          -DPS2X_FFMPEG_PREBUILT_URL="/tmp/$FFMPEG_ZIP"
      - name: Build
        run: cmake --build app/build-win
      - name: Build the recompiler for Windows
        run: >
          cmake -S external/PS2Recomp -B build-recomp-win -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$PWD/tools/windows/llvm-mingw.cmake" -DLLVM_MINGW_ROOT="/opt/$LLVM_MINGW"
          -DPS2X_BUILD_RUNTIME=OFF -DPS2X_BUILD_ANALYZER=OFF -DPS2X_BUILD_TEST=OFF -DPS2X_BUILD_STUDIO=OFF
          -DPS2X_ENABLE_SCCACHE=OFF
          && cmake --build build-recomp-win --target ps2_recomp
      - name: Collect the Windows programs (no game data)
        run: |
          mkdir dist
          cp app/build-win/*_test.exe dist/
          cp build-recomp-win/ps2xRecomp/ps2_recomp.exe dist/
          cp "/opt/$LLVM_MINGW/x86_64-w64-mingw32/bin/libc++.dll" "/opt/$LLVM_MINGW/x86_64-w64-mingw32/bin/libunwind.dll" dist/
          cp app/build-win/*.dll dist/
          ls dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows-tests
          path: dist
          retention-days: 7
      # --- the release package (not for pull requests) ---
      - name: Tools bundled in the package (pinned, checksums)
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /opt/windows-builder-tools && cd /opt/windows-builder-tools
          curl -sSfL -O "https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/llvm-mingw-20261006-ucrt-x86_64.zip"
          curl -sSfL -O "https://github.com/Kitware/CMake/releases/download/v4.4.4/cmake-4.4.4-windows-x86_64.zip"
          curl -sSfL -O "https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-win.zip"
          printf '%s  %s\n' "$LLVM_MINGW_WIN_SHA256" llvm-mingw-20261006-ucrt-x86_64.zip \
                            "$CMAKE_WIN_SHA256" cmake-4.4.4-windows-x86_64.zip \
                            "$NINJA_WIN_SHA256" ninja-win.zip | sha256sum -c -
      - name: Minimal FFmpeg for the package (mpeg2video + SHA-256, LGPL, from the checked source)
        if: github.event_name != 'pull_request'
        run: |
          curl -sSfL -o /tmp/ffmpeg-7.1.tar.xz https://ffmpeg.org/releases/ffmpeg-7.1.tar.xz
          echo "$FFMPEG_SRC_SHA256  /tmp/ffmpeg-7.1.tar.xz" | sha256sum -c -
          tools/release/build_ffmpeg.sh windows /tmp/ffmpeg-7.1.tar.xz /opt/ffmpeg-min-windows "/opt/$LLVM_MINGW" > /tmp/ffmpeg-build.log 2>&1 \
            || { tail -50 /tmp/ffmpeg-build.log; exit 1; }
          tail -2 /tmp/ffmpeg-build.log
      - name: "Package (checks: clean tree, nothing from the game)"
        if: github.event_name != 'pull_request'
        run: |
          git config --global --add safe.directory "*" # the repo and the dependency checkouts
          rm -rf dist
          LLVM_MINGW_ROOT="/opt/$LLVM_MINGW" DW5XL_WIN_TOOLS=/opt/windows-builder-tools \
            DW5XL_FFMPEG_MIN=/opt/ffmpeg-min-windows \
            python3 tools/release/make_release.py windows --build app/build-win --recomp-build build-recomp-win
          rm -rf dist/DW5XL-*-windows-x64/
          ls -la dist
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: windows-package
          path: dist
          retention-days: 14
          compression-level: 0 # already a zip

  windows-test:
    needs: windows-build
    runs-on: windows-latest # real Windows, no GPU
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-tests
          path: dist
      - name: Run the tests that need no game data
        shell: pwsh
        working-directory: dist
        run: |
          # Every test program in the artifact (the build only made the ones that need no game data),
          # each with a 5-minute limit.
          $failed = @()
          foreach ($exe in Get-ChildItem -Filter 'dw5xl_*_test.exe' | Sort-Object Name) {
            $t = $exe.BaseName
            $p = Start-Process -FilePath $exe.FullName -NoNewWindow -PassThru `
                 -RedirectStandardOutput "$t.out.log" -RedirectStandardError "$t.err.log"
            if (-not $p.WaitForExit(300000)) {
              $p | Stop-Process -Force; $failed += $t; Write-Host "TIMEOUT $t"; continue
            }
            if ($p.ExitCode -ne 0) {
              $failed += $t; Write-Host "FAIL $t (exit $($p.ExitCode))"
              Get-Content "$t.out.log", "$t.err.log" -Tail 20
            } else { Write-Host "PASS $t" }
          }
          # The recompiler without a config prints its usage (and exits 1): proves it starts on Windows.
          $usage = (& .\ps2_recomp.exe 2>&1 | Out-String)
          if ($usage -match 'Usage: ps2recomp') { Write-Host "PASS ps2_recomp.exe starts" }
          else { $failed += 'ps2_recomp'; Write-Host "FAIL ps2_recomp.exe: $usage" }
          if ($failed.Count -gt 0) { Write-Host "Failed: $($failed -join ', ')"; exit 1 }
          exit 0

  draft:
    # A package from main that passed every job replaces the files of the draft release (owner tests).
    needs: [linux, windows-build, windows-test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: draft-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-package
          path: dist
      - name: Replace the draft's package (never publishes)
        run: |
          zip=$(ls dist/DW5XL-*-windows-x64.zip)
          version=$(basename "$zip" -windows-x64.zip); version=${version#DW5XL-}
          if ! gh release view "$DRAFT_TAG" --json isDraft --jq .isDraft > /tmp/draft 2>/dev/null; then
            gh release create "$DRAFT_TAG" --draft --target "$GITHUB_SHA" --title "Windows test" --notes "Owner test."
          elif [ "$(cat /tmp/draft)" != true ]; then
            echo "$DRAFT_TAG is published: CI leaves published releases alone"; exit 1
          fi
          gh release upload "$DRAFT_TAG" "$zip" "$zip.sha256" --clobber
          for old in $(gh release view "$DRAFT_TAG" --json assets --jq '.assets[].name' | grep '^DW5XL-' \
                       | grep -v "^DW5XL-$version-windows-x64\.zip"); do
            gh release delete-asset "$DRAFT_TAG" "$old" -y
          done
          subject=$(printf '%s\n' "$COMMIT_MESSAGE" | head -1)
          gh release edit "$DRAFT_TAG" --draft --target "$GITHUB_SHA" \
            --title "Windows test $version (owner test, not a release)" \
            --notes "Built by GitHub Actions from $version (run $GITHUB_RUN_ID) after every test job passed. The builder package: launcher, compiler, sources and tools, nothing from the game; the first start builds the game from your own disc. Latest commit: $subject. Not for distribution."
